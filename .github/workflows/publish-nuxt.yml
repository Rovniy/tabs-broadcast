name: Publish Nuxt module to NPM

# Triggered by tags like `nuxt-v0.1.0`. The core package is published by the separate
# `publish.yml` workflow on GitHub Release; this one only touches packages/nuxt.
on:
  push:
    tags:
      - 'nuxt-v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Extract version from tag
        id: extract_tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${tag#nuxt-v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Update module version
        run: npm version "${{ steps.extract_tag.outputs.VERSION }}" --no-git-tag-version --allow-same-version -w packages/nuxt

      - name: Build module
        run: npm run build -w packages/nuxt

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w packages/nuxt
