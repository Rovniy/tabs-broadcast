name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish:
    # The Nuxt module is released via `nuxt-v*` tags (see publish-nuxt.yml). If a
    # GitHub Release is ever cut on such a tag, skip the core publish so it doesn't
    # try to set the core version from a `nuxt-v…` string.
    if: ${{ !startsWith(github.event.release.tag_name, 'nuxt-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Extract version from tag
        id: extract_tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Update version in package.json
        run: |
          npm version "${{ steps.extract_tag.outputs.VERSION }}" --no-git-tag-version --allow-same-version
          cat package.json

      - name: Build library
        run: npm run build

      # Deploy AFTER the build so the demo ships the freshly built dist/ (including
      # dist/version.js, which carries the just-bumped version).
      - name: Upload files to https://tabs-broadcast.ravy.pro
        uses: SamKirkland/FTP-Deploy-Action@4.1.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Send Discord notification
        run: |
          LAST_COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"💡 [Tabs Broadcast](https://www.npmjs.com/package/tabs-broadcast) : Successfully deployed! Commit: **$LAST_COMMIT_MESSAGE**\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
